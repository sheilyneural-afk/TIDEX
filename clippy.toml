# Quality baseline for clippy. The project is strict about evidence, but it keeps
# the signal focused on correctness and API hygiene rather than formatting-only noise.
warn = [
  "clippy::all",
  "clippy::pedantic",
  "clippy::nursery",
]
allow = [
  "clippy::module_name_repetitions",
  "clippy::missing_errors_doc",
  "clippy::must_use_candidate",
  "clippy::similar_names",
]
deny = [
  "clippy::unwrap_used",
  "clippy::panic",
  "clippy::expect_used",
]
