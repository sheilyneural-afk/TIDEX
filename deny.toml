[advisories]
yanked = "deny"
# Transitive via faer→gemm→paste. Unmaintained (not a vuln); no safe upgrade while on faer 0.24.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste pulled transitively by faer/gemm; no maintained upgrade path yet" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
