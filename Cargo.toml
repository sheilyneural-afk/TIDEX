[package]
name = "cerebro-tidex"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
autobins = false
autotests = false
autobenches = false
autoexamples = false

[features]
default = []
cross-model-plasticity = ["chrono", "reqwest", "candle-core", "candle-nn", "candle-transformers", "tokenizers"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
rustix = { version = "=1.1.4", features = ["fs"] }
crossterm = "=0.28.1"
ratatui = "=0.29.0"
chrono = { version = "0.4", optional = true }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
candle-core = { version = "=0.11.0", optional = true }
candle-nn = { version = "=0.11.0", optional = true }
candle-transformers = { version = "=0.11.0", optional = true }
tokenizers = { version = "=0.22.2", optional = true }

[build-dependencies]
sha2 = "=0.10.9"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Line tables preserve actionable backtraces without retaining the very large
# full debug payload produced by the many test and diagnostic binaries.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "cerebro-tidex"
path = "src/main.rs"

[[bin]]
name = "acquire-system"
path = "src/bin/acquire_system.rs"

[[bin]]
name = "adaptive-learning-cycle"
path = "src/bin/adaptive_learning_cycle.rs"

[[bin]]
name = "autonomous-learning-plan"
path = "src/bin/autonomous_learning_plan.rs"

[[bin]]
name = "ledger-diagnose"
path = "src/bin/ledger_diagnose.rs"

[[bin]]
name = "pure-linear-runner"
path = "src/bin/pure_linear_runner.rs"

[[bin]]
name = "record-representation-evidence"
path = "src/bin/record_representation_evidence.rs"

[[bin]]
name = "tidex-finalize"
path = "src/bin/tidex_finalize.rs"

[[bin]]
name = "tidex"
path = "src/bin/tidex.rs"

[[bin]]
name = "universal-shadow-runner"
path = "src/bin/universal_shadow_runner.rs"

[[bin]]
name = "plasticity-daemon"
path = "src/cross_model/plasticity_daemon.rs"
required-features = ["cross-model-plasticity"]

[[bin]]
name = "tidex-lab-runner"
path = "src/bin/tidex_lab_runner.rs"
required-features = ["cross-model-plasticity"]

[[bin]]
name = "v67-weight-actuator-smoke"
path = "quality/experiments/v67_weight_actuator_smoke.rs"

[[test]]
name = "brain"
path = "tests/brain.rs"

[[test]]
name = "production_surface"
path = "tests/production_surface.rs"

[[test]]
name = "quality_properties"
path = "tests/quality_properties.rs"

[[test]]
name = "convergence_pipeline"
path = "tests/convergence_pipeline.rs"
